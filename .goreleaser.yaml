version: 2

project_name: opsforge

builds:
  - main: .
    binary: opsforge
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
        -X github.com/Mrg77/opsforge/cmd.version={{ .Version }}
        -X github.com/Mrg77/opsforge/cmd.commit={{ .ShortCommit }}
        -X github.com/Mrg77/opsforge/cmd.date={{ .Date }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

# Keyless supply-chain signing (Sigstore/cosign).
#
# We sign only checksums.txt: it already carries the SHA-256 of every archive,
# so a verified signature over it transitively vouches for all release assets.
# The signature is KEYLESS — cosign fetches a short-lived certificate from
# Fulcio bound to the workflow's GitHub OIDC identity, so there is no long-lived
# private key to store or leak. cosign v2 no longer needs COSIGN_EXPERIMENTAL
# for keyless sign-blob; the OIDC token is provided by the runner (see the
# `id-token: write` permission and cosign-installer step in release.yml).
#
# Outputs published next to checksums.txt on the GitHub release:
#   checksums.txt.sig   — the detached signature
#   checksums.txt.pem   — the Fulcio certificate (carries the signing identity)
#
# Verify (see README "Provenance / signature verification"):
#   cosign verify-blob \
#     --certificate checksums.txt.pem \
#     --signature   checksums.txt.sig \
#     --certificate-identity-regexp '^https://github.com/Mrg77/opsforge/\.github/workflows/release\.yml@.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     checksums.txt
signs:
  - cmd: cosign
    # ${artifact} is checksums.txt. `certificate:` makes GoReleaser track
    # the .pem as a release artifact too (otherwise only the .sig is
    # uploaded and `cosign verify-blob --certificate` can't be run).
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
    artifacts: checksum
    output: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^ci:"
      - "^chore:"

# Homebrew (goreleaser v2: homebrew_casks, brews is deprecated), pushed to the
# tap → `brew install mrg77/tap/opsforge`.
homebrew_casks:
  - name: opsforge
    repository:
      owner: Mrg77
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/Mrg77/opsforge"
    description: "Forge your DevOps workstation: pick your CLIs, get a policy-as-code shell layer."
    commit_author:
      name: Mrg77
      email: 52857557+Mrg77@users.noreply.github.com
    # Clear the quarantine attribute so the unsigned binary runs without a
    # Gatekeeper prompt on macOS.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/opsforge"]
          end
