name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR) so CI
# minutes aren't spent on commits that are already outdated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The brew-formula validation test is exercised by the dedicated
      # catalog-validation job; skip it here to keep unit tests offline.
      OPSFORGE_SKIP_BREW_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      # Install the shells the layer targets so their module syntax checks
      # (`zsh -n`, `fish --no-execute`) actually RUN instead of being skipped.
      # zsh ships on macOS; fish needs installing on both.
      - name: Install shells (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh fish
      - name: Install fish (macOS)
        if: runner.os == 'macOS'
        run: brew install fish

      - name: go test (race + coverage)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  # Validates that every brew reference in the catalog resolves to a real
  # formula/cask of the declared kind, via the public Homebrew API — so a
  # renamed/removed formula is caught before a user hits it mid-install.
  catalog-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Validate catalog formulas and github assets against upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go test ./internal/catalog/ -run 'TestCatalogBrewFormulasExist|TestCatalogGitHubAssetsResolve' -v

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Cross-compile all release targets
        run: |
          for os in darwin linux; do
            for arch in amd64 arm64; do
              GOOS=$os GOARCH=$arch go build -o /dev/null .
            done
          done
